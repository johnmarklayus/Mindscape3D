<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindscape 3D — Project Docs</title>
    <script>
      // Apply the saved (or system) theme before the first paint so there is no flash.
      try {
        var saved = localStorage.getItem("mindscape-docs-theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    </script>
    <meta name="description" content="Workflow and script documentation for the Mindscape 3D Unity project." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
